# 环境：奖励、流体松弛、剪枝与安全网。对应稿件 §3.3 与 §4.5–4.6。

reward:
  discard_weight: 1.0          # kappa_d，稿件 Eq. (46)
  fluid_align_weight: 0.0      # beta_f —— 主实验恒为 0（稿件 §4.6.3 明确声明）
  potential_weight: 0.1        # beta_Psi，势函数塑形，策略不变
  gamma: 1.0                   # 未折扣；与 telescoping 恒等式一致

fluid:
  mode: throughput             # throughput | due_date_aware | workload_only | off
                               # throughput   : max sum min(delta_hat*lambda, W)，与按时完工件数同向
                               # due_date_aware: max-min 交期可行比（均衡型，保留作消融）
  enabled: true
  slack_floor: 1.0             # delta_min，秒
  use_flow_balance: true       # 稿件 Eq. (24) 阶段间流平衡
  time_limit_s: 2.0
  threads: 0                   # 0 = 交给求解器决定
  slack_bucket_s: 60.0
  resolve_every: 1             # 流体松弛的重解节流（稿件 §4.9 的摊销系数）。
                               # 1 = 每个决策点都重解（默认，方法行为不变）；
                               # K > 1 时在活跃工序类型集不变的前提下最多每 K 步重解一次。
                               # 实测 LP 占 rollout 用时约一半，而缓存命中率仅 6%——
                               # 每次派工都会改变某两个类型的整数负载，缓存键必然变化         # Δ_δ，触发键的松弛期离散粒度
  cache_enabled: true

action_space:
  eps_f: 1.0e-5                # 剪枝阈值
  theta_crit: 1.5              # 紧急度安全网阈值。取 1.0 时安全网是死分支：is_hopeless 与
                               # _is_critical 的交集是测度零边界，且丢弃在构造动作空间之前
                               # 执行，实测生效率 0/747；1.5 时约 0.5%，2.0 时约 2.1%。
  order_top_k: 5               # 每工序类型暴露的紧急订单槽数 K
  pruning_mode: fluid          # fluid | none | random | heuristic_load
                               # random/heuristic_load 为同基数对照（消融用）
  allow_noop: true             # 主动空闲。non-delay 调度类一般不含最优解，而全部规则
                               # 基线按构造都是 non-delay —— 这是学习策略能表达、
                               # 规则无法表达的自由度（稿件 §4.5.3）
  max_consecutive_noop: 3      # 连续空闲上限，防止策略在同一事件间隔内反复空转

episode:
  max_decision_steps: 200000

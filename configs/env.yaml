# 环境：奖励、流体松弛、剪枝与安全网。对应稿件 §3.3 与 §4.5–4.6。

reward:
  discard_weight: 1.0          # kappa_d，稿件 Eq. (46)
  fluid_align_weight: 0.0      # beta_f —— 主实验恒为 0（稿件 §4.6.3 明确声明）
  potential_weight: 0.1        # beta_Psi，势函数塑形，策略不变
  gamma: 1.0                   # 未折扣；与 telescoping 恒等式一致

fluid:
  mode: due_date_aware         # due_date_aware | workload_only | off
  enabled: true
  slack_floor: 1.0             # delta_min，秒
  use_flow_balance: true       # 稿件 Eq. (24) 阶段间流平衡
  time_limit_s: 2.0
  threads: 0                   # 0 = 交给求解器决定
  slack_bucket_s: 60.0         # Δ_δ，触发键的松弛期离散粒度
  cache_enabled: true

action_space:
  eps_f: 1.0e-5                # 剪枝阈值
  theta_crit: 1.0              # 紧急度安全网阈值；>=1 保证 Prop 2(c)
  order_top_k: 5               # 每工序类型暴露的紧急订单槽数 K
  pruning_mode: fluid          # fluid | none | random | heuristic_load
                               # random/heuristic_load 为同基数对照（消融用）

episode:
  max_decision_steps: 200000

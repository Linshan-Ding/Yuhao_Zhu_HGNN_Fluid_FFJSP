# 环境：候选暴露、保留产能动作、episode 上限。奖励固定为 r_t = ΔN_c / S（Σ r_t = η），无可调项。

action_space:
  order_top_k: 5               # 每工序类型暴露的订单槽数 K
  exposure: hopeful_first      # 槽的暴露顺序。hopeful_first = 先暴露临界比 >= exposure_threshold 的
                               # "可救"订单再按交期；edd = 只按交期（消融 edd_exposure）。
                               # 超负荷 + 紧交期时最紧急的 K 个往往都已救不回来，会把可救的藏在槽外
  exposure_threshold: 1.5      # 与 SPT-Idle 的默认等待阈值同值
  allow_noop: true             # 保留产能动作。全部规则按构造都是 non-delay；消融 nohold 关掉它
  max_consecutive_noop: 3      # 连续 no-op 上限（防死锁守卫 ii）

episode:
  max_decision_steps: 200000

# CoH 试点 P0：最小骨干。无流体、MLP 编码、无动作自注意力、无 BC、无势函数塑形；
# 保留 no-op 与两条防死锁守卫；候选按"可救优先"暴露。规则基线评测时用同一份配置，
# 这样规则与学习策略看到的是同一个候选集。
variant: {name: CoH-P0, encoder: mlp, fluid_node_features: false}
fluid: {mode: "off", enabled: false}
action_space: {pruning_mode: none, exposure: hopeful_first, exposure_threshold: 1.5}
network: {action_attention: false}
training: {bc_warmup_steps: 0}
reward: {potential_weight: 0.0}
coh: {commit_critic: false, gate: false, hold_critic: false, critic_coeff: 0.5}

# 算例参数表（训练随机构造的分布）与评测档设计表。每档带固定种子，重建结果逐位相同。
# 与 docs/experiment-spec.md §3 一一对应。改参数只改这里，不改代码。

param_table:
  machines_per_stage: 5
  stage_count: 5
  product_count: 5
  proc_time_range: [25, 450]          # p_rjm ~ rand[a, b]，整数（CP-SAT 用整数时间网格）
  order_count_range: [20, 200]        # S
  rho_range: [0.8, 2.2]               # 按系统负荷均匀抽样，再反推到达间隔
  ddt_range: [400, 2000]              # 交期宽松度：覆盖评测网格 700-1800 并留余量
  ddt_spread: [0.7, 1.4]              # 逐单交期乘性扰动 due_i = a_i + DDT * U[lo, hi]

design:
  grid:                                # 主评测：负荷 x 交期紧度 x 规模
    rho_levels: [0.8, 1.2, 1.6, 2.0]
    ddt_levels: [700, 1100, 1800]
    order_counts: [50, 100, 150]
    seed: 20260901

  val:                                 # 选 best checkpoint，不进论文评测
    rho_levels: [1.0, 1.6, 2.0]
    ddt_levels: [900, 1500]
    order_count: 80
    seed: 20260902

  small:                               # 精确参照：CP-SAT 离线最优与滚动重优化
    order_counts: [12, 16, 20, 25]
    ddt_levels: [500, 600, 700]
    instances_per_cell: 2
    target_rho_sys: 2.5                # 订单数很少时需更高到达强度才有竞争
    seed: 20260903

  ood:                                 # 未见的规模、结构与到达过程，不重训
    ddt: 900
    target_rho_sys: 1.6
    order_count_default: 150
    seed: 20260904
    conditions:
      - {name: "S300",          order_count: 300}
      - {name: "S500",          order_count: 500}
      - {name: "M3perstage",    machines_per_stage: 3}
      - {name: "M8perstage",    machines_per_stage: 8}
      - {name: "R8J7",          product_count: 8, stage_count: 7}
      - {name: "mmpp",          arrival_process: mmpp}
      - {name: "deterministic", arrival_process: deterministic}

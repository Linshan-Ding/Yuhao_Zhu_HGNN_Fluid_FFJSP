# 算例参数表（训练随机构造的分布）与算例设计表（评测算例，逐单元固定落盘）
# 与 docs/experiment-spec.md §6A 一一对应。改参数只改这里，不改代码。

param_table:
  machines_per_stage: 5
  stage_count: 5
  product_count: 5
  proc_time_range: [25, 450]          # p_rjm ~ rand[a, b]，秒
  order_count_range: [20, 200]        # S
  interarrival_range: [1, 200]        # Δt ~ rand[a, b]，秒
  ddt_range: [300, 2500]              # 交期宽松度

design:
  small:                               # 可精确求解，校准真实 optimality gap
    order_counts: [6, 8, 10, 12]
    product_count: 2
    stage_count: 3
    machines_per_stage: 2
    ddt_levels: [200, 260]             # 结构因子低/高两水平。取值经扫描确定：
                                       # DDT 须与 3 阶段最小路径同量级，才能让
                                       # eta_off 严格落在 (0,1) —— 否则最优性间隙
                                       # 要么恒为 0（太松）要么恒为 1（太紧），都无信息量
    proc_time_range: [20, 120]         # 小档专用：3 阶段最小路径须显著小于 DDT，
                                       # 否则订单在到达时刻即已 hopeless，最优解恒为 0
    target_rho_sys: 1.3                # 由目标负荷反推到达率，使 eta_off < 1
                                       # ——负荷过轻时最优性间隙没有信息量
    instances_per_cell: 2

  main:                                # 主对比 / 消融 / 统计检验主战场
    order_counts: [50, 100, 150]
    ddt_levels: [500, 600, 900, 1200, 1600]

  arrival:                             # 到达强度 × 到达过程（跨饱和点）
    order_count: 100
    ddt: 900
    mean_interarrival: [200, 100, 50, 25, 12.5]
    processes: [deterministic, poisson, mmpp]

  ood:                                 # 分布外：只推规模/结构因子，不动到达分布
    conditions:
      - {name: "S300",       order_count: 300}
      - {name: "S500",       order_count: 500}
      - {name: "M3perstage", machines_per_stage: 3}
      - {name: "M8perstage", machines_per_stage: 8}
      - {name: "R8J7",       product_count: 8, stage_count: 7}
    ddt: 900
    order_count_default: 150

  val:                                 # 选 best checkpoint，不进论文评测
    count: 5
    order_count: 80
    ddt: 900

  case3d:                              # 构造的 3D 打印情景（6 阶段工艺链）
    order_counts: [50, 100, 150]
    ddt_levels: [600, 900, 1200]
    stage_names: [slicing, preparation, printing, postprocess, secondary, inspection]
    machines_per_stage: [2, 2, 3, 3, 2, 2]
    product_count: 3                   # 高分子夹具 / 医疗导板 / 点阵支架
    proc_time_range: [30, 600]

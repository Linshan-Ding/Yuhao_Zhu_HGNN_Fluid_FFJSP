# 训练：多进程采样 + 批量 PPO（主方法与规则选择基线）、Double DQN（两个价值型基线）、网络与运行时。

training:
  method: coh                  # coh | rule_ppo | dqn | hdqn（基线配置覆盖）
  total_steps: 6000000         # 训练预算 = 环境交互步数（唯一真源；所有方法相同）
  seed: null                   # null = 随机 31 位整数，写入 config_snapshot.yaml，事后可精确复现

rollout:
  workers: auto                # auto = max(1, CPU 核数 - 2)；容器里 2-3，用户机器 14
  episodes_per_epoch: 56       # 每个 epoch 采集的 episode 数，与 worker 数无关
  val_every: 2                 # 每几个 epoch 在 val 档贪心验证一次

ppo:
  lr: 3.0e-4
  lr_final_ratio: 0.1          # 线性退火到 lr * ratio（按 total_steps）
  gae_lambda: 0.95
  update_epochs: 4
  clip_eps: 0.2
  entropy_coeff: 0.01
  value_coeff: 0.5
  max_grad_norm: 0.5
  target_kl: 0.02              # k3 估计的每个 update-epoch 均值超过即停；单 minibatch 超 4 倍硬停
  minibatch_size: 2048
  minibatch_size_large: 4096   # GPU 且 epoch 转移数 >= 64k 时用

dqn:
  lr: 1.0e-4
  minibatch_size: 512
  replay_capacity: 300000      # 转移数
  learning_starts: 20000
  replay_ratio: 0.05           # 每个 epoch 梯度步数 = ratio x 新转移数（minibatch 512：每个转移平均被回放约 25 次）
  n_step: 5
  target_update_steps: 2000    # 梯度步
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_fraction: 0.2        # ε 线性退火占预算的比例
  max_grad_norm: 1.0

network:
  embed_dim: 16
  actor_hidden: [128, 128, 128]
  critic_hidden: [128, 128, 128]

coh:
  commit_critic: true          # 承诺评估器 p̂(o|s)
  gate: true                   # 显式等待门控
  hold_critic: true            # 等待前景评估器 ĥ(s)
  gate_context: true           # 门控是否看工况特征与全局特征（消融 nogatefeat 关掉）
  critic_coeff: 0.5            # 两个 BCE 辅助损失的权重
  detach_gate_inputs: true     # 门控里的 max p̂ 与 ĥ 不回传策略梯度，评估器只由标签训练

runtime:
  update_device: auto          # auto -> cuda if available else cpu（只在主进程）
  n_runs: 5
  eval_rollouts: 10            # 随机规则（Random、RRC）的评测 rollout 数

# 算法：PPO + 行为策略修正 + 网络结构。对应稿件 §4.7–4.8 与 Table 6。

ppo:
  total_epochs: 1000
  lr: 3.0e-4
  gamma: 1.0
  gae_lambda: 0.95
  update_epochs: 3             # K_ppo
  clip_eps: 0.2                # epsilon_clip
  entropy_coeff: 0.01          # c_3
  policy_coeff: 1.0            # c_1
  value_coeff: 0.5             # c_2
  max_grad_norm: 0.5
  target_kl: 0.03
  minibatch_size: 128          # 必须显著小于每 epoch 的 buffer，否则退化为全批量梯度下降
  rollout_episodes: 8          # 每个 epoch 采集的完整 episode 数（约 2900 条 transition）

exploration:
  # epsilon-greedy 混合行为策略，稿件 Eq. (54)
  behaviour_correction: true   # true = 存 log b_k 并用修正比率（默认）
                               # false = 存 log pi_old（未修正对照，消融用）
  epsilon0: 0.3                # 起始探索率。取 1.0 会让 b_k 恒等于均匀分布，
                               # 此时 PPO 的裁剪区间等价于"强制策略保持均匀"，是持续的反向拉力
  epsilon_min: 0.001
  anneal_epochs: 350           # K_tot：退火只占总训练量的 35%，留出收敛期

network:
  embed_dim: 16                # d
  gat_layers: 2                # L
  gat_heads: 1
  actor_hidden: [128, 128, 128]
  critic_hidden: [128, 128, 128]
  action_attention: true       # 动作级自注意力，稿件 Eq. (39)
  action_attention_heads: 1
  dropout: 0.0

runtime:
  rollout_device: cpu          # 离散事件环境在 CPU 上推进
  update_device: auto          # auto -> cuda if available else cpu
  n_runs: 5                    # 每个方法的独立 run 次数（无随机种子）
  eval_rollouts: 10            # 每个 checkpoint 在每个算例上的评测 rollout 数

training:
  # 行为克隆热启动：从最强调度规则起步，PPO 只需在此之上改进。
  # 这是方法的一部分，会在论文方法节如实描述，不是隐藏的预训练技巧。
  bc_warmup_steps: 3000        # 0 表示关闭（消融变体用）
  bc_expert: SPT               # 由 run_05 的规则评测结果选出的最强规则

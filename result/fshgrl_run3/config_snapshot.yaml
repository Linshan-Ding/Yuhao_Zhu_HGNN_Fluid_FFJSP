  - 20
  - 200
  interarrival_range:
  - 1
  - 200
  rho_range:
  - 0.8
  - 1.8
  ddt_range:
  - 400
  - 1100
  ddt_spread:
  - 0.7
  - 1.4
design:
  small:
    order_counts:
    - 12
    - 16
    - 20
    - 25
    ddt_levels:
    - 500
    - 600
    - 700
    target_rho_sys: 2.5
    instances_per_cell: 2
  main:
    order_counts:
    - 50
    - 100
    - 150
    ddt_levels:
    - 700
    - 900
    - 1100
    - 1400
    - 1800
    target_rho_sys: 1.6
  arrival:
    order_count: 100
    ddt: 900
    mean_interarrival:
    - 200
    - 100
    - 50
    - 25
    - 12.5
    processes:
    - deterministic
    - poisson
    - mmpp
  ood:
    conditions:
    - name: S300
      order_count: 300
    - name: S500
      order_count: 500
    - name: M3perstage
      machines_per_stage: 3
    - name: M8perstage
      machines_per_stage: 8
    - name: R8J7
      product_count: 8

    - 30
    - 600
reward:
  discard_weight: 1.0
  fluid_align_weight: 0.0
  potential_weight: 0.1
  gamma: 1.0
fluid:
  mode: throughput
  enabled: true
  slack_floor: 1.0
  use_flow_balance: true
  time_limit_s: 2.0
  threads: 0
  slack_bucket_s: 60.0
  resolve_every: 1
  cache_enabled: true
action_space:
  eps_f: 1.0e-05
  theta_crit: 1.5
  order_top_k: 5
  pruning_mode: fluid
  allow_noop: true
  max_consecutive_noop: 3
episode:
  max_decision_steps: 200000
ppo:
  total_epochs: 250
  lr: 0.0003
  gamma: 1.0
  gae_lambda: 0.95
  update_epochs: 3
  clip_eps: 0.2
  entropy_coeff: 0.01
  policy_coeff: 1.0
  value_coeff: 0.5
  max_grad_norm: 0.5
  target_kl: 0.03
  minibatch_size: 128
  rollout_episodes: 8
exploration:
  behaviour_correction: true
  epsilon0: 0.3
  epsilon_min: 0.001
  anneal_epochs: 90
network:
  embed_dim: 16
  gat_layers: 2
  gat_heads: 1
  actor_hidden:
  - 128
  - 128
  - 128
  critic_hidden:
  - 128
  - 128
  - 128
  action_attention: true
  action_attention_heads: 1
  dropout: 0.0
runtime:
  rollout_device: cpu
  update_device: auto
  n_runs: 5
  eval_rollouts: 10
training:
  bc_warmup_steps: 3000
  bc_expert: SPT
